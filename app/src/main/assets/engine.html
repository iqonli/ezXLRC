<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ezXLRC Search Runtime</title>
</head>
<body>
<script>
(function () {
    'use strict';

    function bytesToBase64(bytes) {
        let binary = '';
        const step = 0x8000;
        for (let i = 0; i < bytes.length; i += step) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + step, bytes.length)));
        }
        return btoa(binary);
    }

    function textToBytes(text) {
        return new TextEncoder().encode(text);
    }

    function bytesToWordArray(bytes) {
        const words = [];
        for (let i = 0; i < bytes.length; i += 4) {
            words[i >>> 2] = ((bytes[i] || 0) << 24) |
                ((bytes[i + 1] || 0) << 16) |
                ((bytes[i + 2] || 0) << 8) |
                (bytes[i + 3] || 0);
        }
        return { words: words, sigBytes: bytes.length, __bytes: Array.from(bytes) };
    }

    function parseWordArray(value, encoding) {
        const text = String(value);
        const bytes = encoding === 'latin1'
            ? Uint8Array.from(Array.from(text, ch => ch.charCodeAt(0) & 0xff))
            : textToBytes(text);
        return { __text: text, __bytes: Array.from(bytes), words: bytesToWordArray(bytes).words, sigBytes: bytes.length };
    }

    window.CryptoES = {
        enc: {
            Latin1: { parse: value => parseWordArray(value, 'latin1') },
            Utf8: { parse: value => parseWordArray(value, 'utf8') },
            Hex: { name: 'Hex' }
        },
        mode: { ECB: 'ECB' },
        lib: {
            WordArray: {
                create: value => {
                    const bytes = value instanceof ArrayBuffer
                        ? new Uint8Array(value)
                        : ArrayBuffer.isView(value)
                            ? new Uint8Array(value.buffer, value.byteOffset, value.byteLength)
                            : Uint8Array.from(value || []);
                    return bytesToWordArray(bytes);
                }
            }
        },
        AES: {
            encrypt: (input, key, options) => {
                const plain = input && input.__text !== undefined
                    ? input.__text
                    : new TextDecoder().decode(Uint8Array.from(input && input.__bytes || []));
                const secret = key && key.__text !== undefined ? key.__text : '';
                const hex = AndroidBridge.aesEcbEncrypt(plain, secret);
                const ciphertext = { toString: () => hex };
                return { ciphertext: ciphertext, toString: () => hex };
            }
        },
        MD5: value => {
            const bytes = Uint8Array.from(value && value.__bytes || []);
            const hex = AndroidBridge.md5Base64(bytesToBase64(bytes));
            const raw = new Uint8Array(16);
            for (let i = 0; i < 16; i++) raw[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16) || 0;
            return bytesToWordArray(raw);
        }
    };

    window.querystring = {
        stringify: function (values) {
            const pairs = [];
            Object.keys(values || {}).forEach(key => {
                const value = values[key];
                if (value === undefined || value === null) return;
                const list = Array.isArray(value) ? value : [value];
                list.forEach(item => pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(String(item))));
            });
            return pairs.join('&');
        },
        parse: function (value) {
            const result = {};
            new URLSearchParams(String(value || '').replace(/^\?/, '')).forEach((part, key) => {
                if (Object.prototype.hasOwnProperty.call(result, key)) {
                    if (!Array.isArray(result[key])) result[key] = [result[key]];
                    result[key].push(part);
                } else result[key] = part;
            });
            return result;
        }
    };

    window.evalLib = function () { /* querystring and CryptoES compatibility are built in. */ };
    window.messageLoop = function () { /* Requests are completed synchronously by the native bridge. */ };
    window.log = function (message) { AndroidBridge.log(String(message)); };

    function encodeBase64(bytes) {
        let binary = '';
        const view = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
        for (let i = 0; i < view.length; i += 0x8000) {
            binary += String.fromCharCode.apply(null, view.subarray(i, Math.min(i + 0x8000, view.length)));
        }
        return btoa(binary);
    }

    function decodeBase64(value) {
        const binary = atob(value || '');
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    window.request = function (settings, callback) {
        if (typeof settings === 'string') settings = { url: settings };
        settings = settings || {};
        const body = settings.body;
        const raw = settings.raw === true || settings.responseType === 'arraybuffer' || settings.encoding === 'binary';
        const byteArray = raw && Array.isArray(body) && body.every(value => Number.isInteger(value) && value >= 0 && value <= 255);
        const binaryBody = body instanceof ArrayBuffer || ArrayBuffer.isView(body) || byteArray;
        const bodyBytes = !binaryBody ? null : body instanceof ArrayBuffer
            ? new Uint8Array(body)
            : ArrayBuffer.isView(body)
                ? new Uint8Array(body.buffer, body.byteOffset, body.byteLength)
                : Uint8Array.from(body);
        const request = {
            url: settings.url || '',
            method: settings.method || 'GET',
            headers: settings.headers || {},
            body: binaryBody || body == null ? null : (typeof body === 'string' ? body : JSON.stringify(body)),
            bodyBase64: binaryBody ? encodeBase64(bodyBytes) : '',
            raw: raw,
            timeout: settings.timeout || 12000
        };
        const result = JSON.parse(AndroidBridge.requestSync(JSON.stringify(request)));
        const error = result.error ? new Error(result.error) : null;
        const response = { statusCode: result.statusCode || 0, headers: result.headers || {} };
        const responseBody = raw ? decodeBase64(result.bodyBase64 || '') : (result.body || '');
        if (typeof callback === 'function') callback(error, response, responseBody);
        return responseBody;
    };

    function wrapXmlElement(element) {
        return {
            getAttr: name => element.getAttribute(name),
            getFirstChild: () => {
                const child = element.firstChild;
                return { getCDATA: () => child ? (child.nodeValue || child.textContent || '') : '' };
            },
            findElement: name => wrapXmlNodes(Array.from(element.getElementsByTagName(name)))
        };
    }

    function wrapXmlNodes(nodes) {
        const wrapped = nodes.map(wrapXmlElement);
        wrapped.getAttr = name => wrapped.length ? wrapped[0].getAttr(name) : null;
        wrapped.getFirstChild = () => wrapped.length ? wrapped[0].getFirstChild() : null;
        return wrapped;
    }

    window.getChildElementCDATA = function (node, name) {
        if (!node || typeof node.findElement !== 'function') return '';
        const matches = node.findElement(name);
        if (!matches || !matches.length) return '';
        const first = matches[0].getFirstChild();
        return first && typeof first.getCDATA === 'function' ? first.getCDATA() : '';
    };

    window.mxml = {
        MXML_DESCEND: 0,
        loadString: function (xml) {
            try {
                let source = String(xml || '');
                let document = new DOMParser().parseFromString(source, 'application/xml');
                if (document.getElementsByTagName('parsererror').length) {
                    source = source.replace(/&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)/g, '&amp;');
                    document = new DOMParser().parseFromString(source, 'application/xml');
                }
                if (document.getElementsByTagName('parsererror').length) return null;
                return { findElement: name => wrapXmlNodes(Array.from(document.getElementsByTagName(name))) };
            } catch (error) {
                return null;
            }
        }
    };

    function toHimalaya(node) {
        if (node.nodeType === 1) {
            return {
                type: 'element',
                tagName: (node.tagName || '').toLowerCase(),
                attributes: Array.from(node.attributes || []).map(attr => ({ key: attr.name, value: attr.value })),
                children: Array.from(node.childNodes || []).map(toHimalaya).filter(Boolean)
            };
        }
        if (node.nodeType === 3 || node.nodeType === 4) {
            return { type: 'text', content: node.nodeValue || '' };
        }
        return null;
    }

    window.himalayaParse = function (html) {
        const document = new DOMParser().parseFromString(String(html), 'text/html');
        return Array.from(document.body.childNodes).map(toHimalaya).filter(Boolean);
    };

    window.runSearcher = async function (source, meta) {
        try {
            let code = String(source).replace(/^\uFEFF/, '');
            code = code.replace(/^\s*import\s+crypto\s+from\s+['"]crypto-es\/lib\/index\.js['"]\s*;?\s*/gm,
                'const crypto = window.CryptoES;\n');
            code = code.replace(/^\s*import\s*\{\s*parse\s*\}\s*from\s*['"]himalaya\/src\/index\.js['"]\s*;?\s*/gm,
                'const parse = window.himalayaParse;\n');
            code = code.replace(/^\s*import\s+[^;]+;?\s*$/gm, '');
            code = code.replace(/\bexport\s+(?=(?:function|const|let|class)\b)/g, '');

            const factory = new Function(code + '\n;return { getConfig: typeof getConfig === "function" ? getConfig : null, getLyrics: typeof getLyrics === "function" ? getLyrics : null };');
            const api = factory();
            if (!api.getLyrics) throw new Error('Searcher does not export getLyrics');
            const config = {};
            if (api.getConfig) api.getConfig(config);
            const manager = {
                createLyric: () => ({}),
                addLyric: item => {
                    item = item || {};
                    let data = item.lyricData;
                    let encoded = '';
                    if (data instanceof ArrayBuffer) encoded = bytesToBase64(new Uint8Array(data));
                    else if (ArrayBuffer.isView(data)) encoded = bytesToBase64(new Uint8Array(data.buffer, data.byteOffset, data.byteLength));
                    AndroidBridge.addLyric(JSON.stringify({
                        title: item.title || meta.title || '',
                        artist: item.artist || meta.artist || '',
                        album: item.album || meta.album || '',
                        fileType: item.fileType || 'lrc',
                        lyricText: typeof item.lyricText === 'string' ? item.lyricText : '',
                        lyricDataBase64: encoded,
                        location: item.location || ''
                    }));
                },
                checkAbort: () => false,
                getSvcData: key => AndroidBridge.getSvcData(String(key)),
                setSvcData: (key, value) => AndroidBridge.setSvcData(String(key), String(value))
            };
            const returned = api.getLyrics(meta || {}, manager);
            if (returned && typeof returned.then === 'function') await returned;
            // request() is synchronous at the native bridge; this yields once for Promise callbacks.
            await new Promise(resolve => setTimeout(resolve, 0));
            AndroidBridge.onSearchDone();
        } catch (error) {
            AndroidBridge.onSearchError(error && (error.stack || error.message) ? (error.stack || error.message) : String(error));
        }
    };
})();
</script>
</body>
</html>
